apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          args: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              host="mongodb-0.mongodb.flash-sale-infra.svc.cluster.local:27017"
              until mongosh --host "$host" --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; do sleep 2; done
              mongosh --host "$host" --quiet --eval '
                try { rs.status() }
                catch (error) {
                  rs.initiate({
                    _id: "rs0",
                    members: [{ _id: 0, host: "mongodb-0.mongodb.flash-sale-infra.svc.cluster.local:27017" }]
                  })
                }
              '

