apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-init-app-databases.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=identity_password="$IDENTITY_DB_PASSWORD" \
      --set=inventory_password="$INVENTORY_DB_PASSWORD" \
      --set=file_password="$FILE_DB_PASSWORD" <<-'EOSQL'
      CREATE ROLE identity_app LOGIN PASSWORD :'identity_password';
      CREATE ROLE inventory_app LOGIN PASSWORD :'inventory_password';
      CREATE ROLE file_app LOGIN PASSWORD :'file_password';
      CREATE DATABASE identity OWNER identity_app;
      CREATE DATABASE inventory OWNER inventory_app;
      CREATE DATABASE file OWNER file_app;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flash-sale-infra-credentials
                  key: POSTGRES_SUPERUSER_PASSWORD
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flash-sale-infra-credentials
                  key: IDENTITY_DB_PASSWORD
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flash-sale-infra-credentials
                  key: INVENTORY_DB_PASSWORD
            - name: FILE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flash-sale-infra-credentials
                  key: FILE_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d postgres"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-init-app-databases.sh
              subPath: 01-init-app-databases.sh
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

